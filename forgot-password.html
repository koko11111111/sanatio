<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANATIO | Reset Password</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>

  <main class="auth-layout">
    <section class="card">
      <a class="back-link" href="login.html">← Back to Login</a>
      <h1>Reset Password</h1>

      <!-- STEP 1 -->
      <form class="auth-form" id="reset-request-form" novalidate>
        <p>Enter your email and we'll generate a reset code for you.</p>
        <label for="reset-email">Email</label>
        <input id="reset-email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">
        <p id="reset-request-message" class="form-message" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary full" id="reset-send-btn">Get Reset Code</button>
      </form>

      <!-- STEP 2 -->
      <div class="auth-form hidden" id="reset-verify-form">
        <p class="reset-email-sent">Resetting password for <strong id="reset-email-display"></strong></p>

        <!-- Big code display -->
        <div class="reset-code-box">
          <p class="reset-code-label">Your reset code</p>
          <p class="reset-code-value" id="reset-code-display">------</p>
          <p class="reset-code-note">Copy the code above and paste it in the field below.</p>
        </div>

        <form id="reset-verify-inner-form" novalidate>
          <label for="reset-code">Enter Code</label>
          <input id="reset-code" name="code" type="text" inputmode="numeric"
            maxlength="6" placeholder="6-digit code" required autocomplete="one-time-code">

          <label for="reset-password">New Password</label>
          <p class="password-hint">Min 8 chars — uppercase, lowercase, number, symbol.</p>
          <div class="password-field">
            <input id="reset-password" name="password" type="password"
              placeholder="New password" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="reset-password" aria-label="Show password">🙈</button>
          </div>

          <label for="reset-confirm">Confirm Password</label>
          <div class="password-field">
            <input id="reset-confirm" name="confirmPassword" type="password"
              placeholder="Re-enter new password" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="reset-confirm" aria-label="Show password">🙈</button>
          </div>

          <p id="reset-strength" class="form-message" aria-live="polite"></p>
          <p id="reset-verify-message" class="form-message" aria-live="polite"></p>

          <button type="submit" class="btn btn-primary full">Update Password</button>
        </form>

        <div style="display:flex;gap:.75rem;margin-top:.75rem;flex-wrap:wrap">
          <button type="button" class="btn btn-secondary" id="reset-resend-btn">Generate New Code</button>
          <button type="button" class="btn-text-link" id="reset-change-email">Use different email</button>
        </div>
      </div>

      <p class="footer-text">Remembered it? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="forgot-password.js" defer></script>
</body>
</html>
