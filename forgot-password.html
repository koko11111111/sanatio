<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANATIO | Reset Password</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>
  <script src="friends.js"></script>
  <script src="navbar.js"></script>

  <main class="auth-layout">
    <section class="card">
      <a class="back-link" href="login.html">← Back to Login</a>
      <h1>Reset Password</h1>
      <p id="reset-step-desc">Enter your email. We will send a verification code before you can set a new password.</p>

      <!-- Step 1: request code by email -->
      <form class="auth-form" id="reset-request-form" novalidate>
        <label for="reset-email">Email</label>
        <input id="reset-email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">
        <p id="reset-request-message" class="form-message" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary full" id="reset-send-btn">Send verification code</button>
      </form>

      <!-- Step 2: verify code + new password -->
      <form class="auth-form hidden" id="reset-verify-form" novalidate>
        <p class="reset-email-sent">Code sent to <strong id="reset-email-display">you@example.com</strong>. Check your inbox and spam folder.</p>

        <label for="reset-code">Verification code</label>
        <input id="reset-code" name="code" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" required autocomplete="one-time-code">

        <label for="reset-password">New Password</label>
        <p class="password-hint">At least 8 characters with uppercase, lowercase, a number, and a symbol.</p>
        <div class="password-field">
          <input id="reset-password" name="password" type="password" placeholder="New password" required autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="reset-password" aria-label="Show password">🙈</button>
        </div>

        <label for="reset-confirm">Confirm New Password</label>
        <div class="password-field">
          <input id="reset-confirm" name="confirmPassword" type="password" placeholder="Re-enter new password" required autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="reset-confirm" aria-label="Show password">🙈</button>
        </div>

        <p id="reset-strength" class="form-message" aria-live="polite"></p>
        <p id="reset-verify-message" class="form-message" aria-live="polite"></p>

        <button type="submit" class="btn btn-primary full">Update Password</button>
        <button type="button" class="btn btn-secondary full" id="reset-resend-btn">Resend code</button>
        <button type="button" class="btn-text-link" id="reset-change-email">Use a different email</button>
      </form>
      <p class="footer-text">Remembered it? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="forgot-password.js" defer></script>
</body>
</html>
