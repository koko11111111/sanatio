<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANATIO | Reset Password</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button">☀️</button>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>

  <main class="auth-layout">
    <section class="card">
      <a class="back-link" href="login.html">← Back to Login</a>
      <h1>Reset Password</h1>
      <p id="reset-step-desc">Enter your email address to reset your password.</p>

      <!-- Step 1: enter email -->
      <form class="auth-form" id="reset-request-form" novalidate>
        <label for="reset-email">Email</label>
        <input id="reset-email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">
        <p id="reset-request-message" class="form-message" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary full" id="reset-send-btn">Continue</button>
      </form>

      <!-- Step 2: enter code + new password -->
      <form class="auth-form hidden" id="reset-verify-form" novalidate>
        <p class="reset-email-sent">Resetting password for <strong id="reset-email-display"></strong></p>

        <!-- Code shown on screen — no email server needed -->
        <div class="reset-code-box" id="reset-code-box">
          <p class="reset-code-label">Your reset code:</p>
          <p class="reset-code-value" id="reset-code-display"></p>
          <p class="reset-code-note">Copy this code and enter it below. It expires in 15 minutes.</p>
        </div>

        <label for="reset-code">Verification Code</label>
        <input id="reset-code" name="code" type="text" inputmode="numeric" maxlength="6"
          placeholder="Enter 6-digit code" required autocomplete="one-time-code">

        <label for="reset-password">New Password</label>
        <p class="password-hint">At least 8 characters — uppercase, lowercase, number, and symbol.</p>
        <div class="password-field">
          <input id="reset-password" name="password" type="password" placeholder="New password" required autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="reset-password" aria-label="Show password">🙈</button>
        </div>

        <label for="reset-confirm">Confirm New Password</label>
        <div class="password-field">
          <input id="reset-confirm" name="confirmPassword" type="password" placeholder="Re-enter new password" required autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="reset-confirm" aria-label="Show password">🙈</button>
        </div>

        <p id="reset-strength" class="form-message" aria-live="polite"></p>
        <p id="reset-verify-message" class="form-message" aria-live="polite"></p>

        <button type="submit" class="btn btn-primary full">Update Password</button>
        <button type="button" class="btn btn-secondary full" id="reset-resend-btn">Generate New Code</button>
        <button type="button" class="btn-text-link" id="reset-change-email">Use a different email</button>
      </form>

      <p class="footer-text">Remembered it? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="forgot-password.js" defer></script>
</body>
</html>
