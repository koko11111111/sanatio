<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Detector | Log In</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>

  <main class="auth-layout">
    <section class="card">
      <a class="back-link" href="index.html">← Back to Welcome</a>
      <h1>Log In</h1>
      <p>Access your AI detection dashboard.</p>

      <form class="auth-form" id="login-form" action="#" method="post" novalidate>
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" placeholder="you@example.com" required>

        <label for="login-password">Password</label>
        <div class="password-field">
          <input id="login-password" name="password" type="password" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" data-target="login-password" aria-label="Show password">🙈</button>
        </div>

        <label class="remember-row" for="remember-me">
          <input id="remember-me" name="rememberMe" type="checkbox">
          Remember me on this device
        </label>

        <p id="login-message" class="form-message" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary full">Log In</button>
        <p class="footer-text" style="margin-top:0.6rem; text-align:right;">
          <a href="forgot-password.html">Forgot password?</a>
        </p>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <div id="google-signin-btn" class="google-signin-wrap"></div>
      <p id="google-auth-message" class="form-message" aria-live="polite"></p>

      <p class="footer-text">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="auth.js" defer></script>
</body>
</html>
