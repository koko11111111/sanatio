<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANATIO | Profile</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">☀️</button>

  <div class="top-profile">
    <button id="profile-menu-trigger" class="profile-trigger" type="button" aria-expanded="false" aria-controls="profile-menu">
      <img id="profile-photo" class="profile-photo-small" src="" alt="User profile photo">
    </button>
    <div id="profile-menu" class="profile-menu hidden">
      <div class="profile-menu-info">
        <p id="profile-name" class="profile-menu-name">User</p>
        <p id="profile-email">email@example.com</p>
        <p id="profile-created">Joined date</p>
      </div>
      <label for="profile-photo-input" class="btn btn-secondary">Change Photo</label>
      <input id="profile-photo-input" type="file" accept="image/*" capture="user">
      <button id="logout-btn" class="btn btn-secondary" type="button">Log Out</button>
    </div>
  </div>

  <main class="dashboard-layout">
    <section class="dashboard-card">
      <header class="dashboard-header">
        <div>
          <h1>Profile</h1>
        </div>
        <nav class="page-nav" aria-label="Site navigation">
          <a class="btn btn-secondary btn-small" href="community.html">← Community</a>
          <a class="btn btn-secondary btn-small" href="aipage.html">Dashboard</a>
        </nav>
      </header>

      <!-- Profile card -->
      <div id="profile-view" class="profile-view">
        <div class="profile-view-loading">Loading profile…</div>
      </div>

      <!-- Their posts -->
      <section class="history-box" id="user-posts-section" style="display:none">
        <div class="history-header">
          <h2 id="user-posts-title">Posts</h2>
        </div>
        <div id="user-posts-feed" class="community-feed"></div>
      </section>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
</body>
</html>
