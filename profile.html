<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANATIO | Profile</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">☀️</button>
  <!-- Firebase MUST load before auth/friends/navbar -->
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Init Firebase immediately so FriendSystem can use it -->
  <script>
    (function() {
      try {
        if (typeof FIREBASE_CONFIG === "object" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
          if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        }
      } catch(e) { console.warn("Firebase init:", e); }
    })();
  </script>

  <script src="auth.js"></script>
  <script src="friends.js"></script>
  <script src="navbar.js"></script>

  <main class="fb-profile-main">

    <!-- Cover + avatar -->
    <div class="fb-cover-wrap" id="fb-cover-wrap">
      <div class="fb-cover-img-wrap">
        <img id="fb-cover-img" class="fb-cover-img" src="" alt="Cover photo">
        <div class="fb-cover-overlay hidden" id="fb-cover-edit-btn">
          <label class="fb-cover-edit-label" for="fb-cover-input">📷 Edit Cover Photo</label>
          <input id="fb-cover-input" type="file" accept="image/*" hidden>
        </div>
      </div>
      <div class="fb-profile-identity">
        <div class="fb-avatar-wrap">
          <img id="fb-avatar" class="fb-avatar" src="" alt="Profile photo">
          <label class="fb-avatar-edit hidden" id="fb-avatar-edit" for="fb-avatar-input" title="Change photo">📷</label>
          <input id="fb-avatar-input" type="file" accept="image/*" hidden>
        </div>
        <div class="fb-identity-info">
          <h1 id="fb-profile-name" class="fb-profile-name"></h1>
          <p id="fb-friend-count" class="fb-friend-count"></p>
        </div>
        <div class="fb-profile-actions" id="fb-profile-actions"></div>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="fb-tab-bar">
      <button class="fb-tab active" data-tab="posts">Posts</button>
      <button class="fb-tab" data-tab="friends">Friends</button>
      <button class="fb-tab" data-tab="about">About</button>
    </div>

    <!-- Body -->
    <div class="fb-profile-body">
      <aside class="fb-profile-left">
        <div class="fb-widget">
          <h3 class="fb-widget-title">Intro</h3>
          <div id="fb-bio-display" class="fb-bio-display"></div>
          <button class="fb-edit-bio-btn btn btn-secondary hidden" id="fb-edit-bio-btn" type="button">Edit Bio</button>
          <form class="fb-bio-form hidden" id="fb-bio-form" novalidate>
            <textarea id="fb-bio-input" class="fb-bio-input" maxlength="200" placeholder="Write something about yourself…"></textarea>
            <div class="fb-bio-actions">
              <button type="submit" class="btn btn-primary btn-small">Save</button>
              <button type="button" class="btn btn-secondary btn-small" id="fb-bio-cancel">Cancel</button>
            </div>
          </form>
        </div>
        <div class="fb-widget">
          <h3 class="fb-widget-title">Friends <span id="fb-friends-count-label" class="fb-widget-count"></span></h3>
          <div id="fb-friends-grid" class="fb-friends-grid"></div>
          <button class="fb-see-all-btn" id="fb-see-all-friends" type="button">See all friends</button>
        </div>
      </aside>

      <section class="fb-profile-right">
        <div id="fb-posts-tab" class="fb-tab-panel active">
          <div id="fb-posts-feed" class="fb-posts-feed">
            <p class="fb-empty">Loading posts…</p>
          </div>
        </div>
        <div id="fb-friends-tab" class="fb-tab-panel">
          <div id="fb-friends-full-grid" class="fb-friends-full-grid"></div>
        </div>
        <div id="fb-about-tab" class="fb-tab-panel">
          <div class="fb-widget">
            <h3 class="fb-widget-title">About</h3>
            <div id="fb-about-content" class="fb-about-content"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="profile.js"></script>
</body>
</html>
