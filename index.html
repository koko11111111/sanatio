<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Detector | Welcome</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">☀️</button>

  <main class="auth-layout">
    <section class="card welcome-card">
      <div class="welcome-brand">
        <div class="welcome-snake-wrap">
          <img src="assets/snake-logo.png" alt="Snake logo" class="welcome-snake-logo" onerror="this.onerror=null;this.src='assets/snake-logo.svg'">
        </div>
        <p class="welcome-slogan">Power · Protect · Perform</p>
      </div>

      <h1>Welcome to AI Photo Detector</h1>
      <p>Detect whether a photo was generated by AI. Choose an option below to continue.</p>

      <div class="actions">
        <a class="btn btn-primary" href="login.html">Log In</a>
        <a class="btn btn-secondary" href="signup.html">Sign Up</a>
      </div>
    </section>
  </main>
</body>
</html>
