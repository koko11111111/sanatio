<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANATIO | Messages</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body class="messenger-page">
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>
  <script src="friends.js"></script>
  <script src="navbar.js"></script>

  <div class="msng-shell">

    <!-- LEFT PANEL -->
    <aside class="msng-left" id="msng-left">
      <div class="msng-left-head">
        <h2 class="msng-left-title">Chats</h2>
        <button class="msng-icon-btn" id="msng-new-btn" title="New message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>

      <div class="msng-search-wrap">
        <input id="msng-search" class="msng-search" type="search" placeholder="🔍 Search chats" autocomplete="off">
        <div id="msng-search-results" class="msng-search-results hidden"></div>
      </div>

      <div id="msng-convs" class="msng-convs"></div>
    </aside>

    <!-- RIGHT PANEL: Chat -->
    <section class="msng-right" id="msng-right">
      <!-- Empty state -->
      <div class="msng-empty-state" id="msng-empty-state">
        <div class="msng-empty-icon">💬</div>
        <h2>Your Messages</h2>
        <p>Send private messages to your friends.</p>
        <button class="btn btn-primary" id="msng-empty-new">Send a New Message</button>
      </div>

      <!-- Chat header -->
      <div class="msng-chat-head hidden" id="msng-chat-head">
        <button class="msng-back" id="msng-back" type="button">←</button>
        <a id="msng-peer-link" href="#">
          <div class="msng-peer-info">
            <div class="msng-peer-avatar-wrap">
              <img id="msng-peer-avatar" class="msng-peer-avatar" src="" alt="">
              <span class="msng-online-dot hidden" id="msng-online-dot"></span>
            </div>
            <div>
              <p id="msng-peer-name" class="msng-peer-name"></p>
              <p id="msng-peer-sub" class="msng-peer-sub">Active recently</p>
            </div>
          </div>
        </a>
        <div class="msng-head-actions">
          <a class="msng-icon-btn" id="msng-head-profile" href="#" title="View Profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a8.38 8.38 0 0 1 13 0"/></svg>
          </a>
        </div>
      </div>

      <!-- Messages -->
      <div class="msng-msgs hidden" id="msng-msgs"></div>

      <!-- Compose -->
      <form class="msng-compose hidden" id="msng-compose" novalidate>
        <label class="msng-attach-btn" for="msng-img-input" title="Send image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <input id="msng-img-input" type="file" accept="image/*" hidden>
        </label>
        <input id="msng-text" class="msng-text-input" type="text" placeholder="Aa" maxlength="1000" autocomplete="off">
        <button type="submit" class="msng-send-btn" id="msng-send-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </form>

      <!-- Image preview above compose -->
      <div id="msng-img-preview-wrap" class="msng-img-preview-wrap hidden">
        <img id="msng-img-preview" src="" alt="Preview">
        <button type="button" id="msng-img-preview-clear">✕</button>
      </div>
    </section>
  </div>

  <script src="messages.js"></script>
</body>
</html>
