<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANATIO | Find Friends</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">☀️</button>
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    (function() {
      try {
        if (typeof FIREBASE_CONFIG==="object" && FIREBASE_CONFIG?.apiKey) {
          if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        }
      } catch(e) { console.warn("Firebase init:", e); }
    })();
  </script>
  <script src="auth.js"></script>
  <script src="friends.js"></script>
  <script src="navbar.js"></script>

  <main class="friends-main">
    <div class="friends-card">

      <!-- Header -->
      <div class="friends-header">
        <h1>Find Friends</h1>
        <div class="friends-search-wrap">
          <input id="friends-search" class="community-search-input" type="search"
            placeholder="🔍 Search by name or email…" autocomplete="off">
        </div>
      </div>

      <!-- Pending requests section -->
      <section class="friends-section" id="requests-section">
        <h2 class="friends-section-title">Friend Requests <span id="requests-count" class="fb-widget-count"></span></h2>
        <div id="requests-grid" class="friends-people-grid">
          <p class="fb-empty">Loading…</p>
        </div>
      </section>

      <!-- Search results -->
      <section class="friends-section hidden" id="search-section">
        <h2 class="friends-section-title">Search Results</h2>
        <div id="search-grid" class="friends-people-grid"></div>
      </section>

      <!-- People you may know -->
      <section class="friends-section" id="suggestions-section">
        <h2 class="friends-section-title">People You May Know</h2>
        <div id="suggestions-grid" class="friends-people-grid">
          <p class="fb-empty">Loading…</p>
        </div>
      </section>

    </div>
  </main>

  <script src="friends-page.js"></script>
</body>
</html>
